[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "channels>=4.3.2",
    "daphne>=4.2.3",
    "django==6.0.6",
    "django-allauth==65.18.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.13.0",
    "django-picklefield==3.4.0",
    "django-q2==1.10.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "numpy==2.5.0",
    "paho-mqtt==2.1.0",
    "pandas==3.0.3",
    "psutil==5.9.8",
    "pyjwt==2.13.0",
    "pytest==8.3.3",
    "pytest-django==4.9.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.5.1",
    "scikit-learn==1.6.1",
    "scipy>=1.18.1",
    "six==1.17.0",
    "sqlparse==0.5.5",
    "uritemplate==4.2.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
